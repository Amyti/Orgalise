<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Karla:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Karla', 'Helvetica Neue', sans-serif; background: #F5F1E8; }
    a { color: #1F1C18; text-decoration: none; }
    a:hover { color: #A94F2E; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1F1C18; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="padding: 24px 20px 0 20px; display: flex; align-items: flex-start; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <a href="Main.dc.html" style="font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #6B6358; font-weight: 600; display: flex; align-items: center; gap: 5px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        Semaine
      </a>
      <div style="font-family: 'Fraunces', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.15;">Jeudi 17</div>
    </div>
    <div style="text-align: right; padding-top: 4px;">
      <div style="font-size: 11px; color: #6B6358;">Libres à deux</div>
      <div style="font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; color: #8A6A12;">5 h 30</div>
    </div>
  </div>

  <div style="padding: 18px 20px 8px 20px; display: flex; gap: 38px;">
    <div style="width: 38px; flex-shrink: 0;"></div>
    <div style="flex-grow: 1; display: flex; gap: 8px;">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: {{moi}}; display: inline-block;"></span>
        <span style="font-size: 12px; font-weight: 700;">Toi</span>
      </div>
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: {{elle}}; display: inline-block;"></span>
        <span style="font-size: 12px; font-weight: 700;">Elle</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 0 20px; display: flex; gap: 8px; min-height: 0;">
    <div style="width: 30px; flex-shrink: 0; position: relative;">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="8">
        <div style="{{h.label}}">{{h.text}}</div>
      </sc-for>
    </div>

    <div style="flex-grow: 1; position: relative; background: #FFFDF8; border: 1px solid #E7E0D0; border-radius: 14px; overflow: hidden;">

      <sc-for list="{{hours}}" as="h" hint-placeholder-count="8">
        <div style="{{h.line}}"></div>
      </sc-for>

      <sc-for list="{{free}}" as="f" hint-placeholder-count="2">
        <div style="{{f.s}}">
          <span style="{{f.tagStyle}}">{{f.tag}}</span>
        </div>
      </sc-for>

      <div style="position: absolute; left: 10px; right: 10px; top: 0; bottom: 0; display: flex; gap: 8px;">
        <div style="position: relative; flex-grow: 1;">
          <sc-for list="{{mine}}" as="b" hint-placeholder-count="1">
            <div style="{{b.s}}">
              <div style="font-size: 12px; font-weight: 700; line-height: 1.25;">{{b.title}}</div>
              <div style="font-size: 10.5px; opacity: 0.85; margin-top: 1px;">{{b.time}}</div>
            </div>
          </sc-for>
        </div>
        <div style="position: relative; flex-grow: 1;">
          <sc-for list="{{hers}}" as="b" hint-placeholder-count="2">
            <div style="{{b.s}}">
              <div style="font-size: 12px; font-weight: 700; line-height: 1.25;">{{b.title}}</div>
              <div style="font-size: 10.5px; opacity: 0.85; margin-top: 1px;">{{b.time}}</div>
            </div>
          </sc-for>
        </div>
      </div>

      <sc-for list="{{both}}" as="b" hint-placeholder-count="1">
        <div style="{{b.s}}">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: #F6E2B2; display: inline-block;"></span>
            <span style="font-size: 10px; letter-spacing: 1.2px; font-weight: 700; color: #F6E2B2;">À DEUX</span>
          </div>
          <div style="font-family: 'Fraunces', Georgia, serif; font-size: 17px; font-weight: 600; margin-top: 3px;">{{b.title}}</div>
          <div style="font-size: 11.5px; opacity: 0.8; margin-top: 1px;">{{b.time}}</div>
        </div>
      </sc-for>

    </div>
  </div>

  <div style="height: 74px; flex-shrink: 0; border-top: 1px solid #E7E0D0; margin-top: 14px; display: flex; align-items: flex-start; padding: 11px 26px 0 26px; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1F1C18" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      <span style="font-size: 10px; font-weight: 700;">Agenda</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="1.8" stroke-linecap="round"><path d="M3 7h18v12H3z"></path><path d="M3 11h18M7 15h3"></path></svg>
      <span style="font-size: 10px; color: #6B6358; font-weight: 600;">Dépenses</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"></circle><circle cx="16.5" cy="9.5" r="2.4"></circle><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"></path></svg>
      <span style="font-size: 10px; color: #6B6358; font-weight: 600;">Nous</span>
    </div>
  </div>

  <button type="button" aria-label="Ajouter un événement" style="position: absolute; right: 20px; bottom: 88px; width: 56px; height: 56px; border-radius: 50%; border: none; background: #1F1C18; color: #FFFDF8; font-size: 26px; line-height: 1; cursor: pointer; box-shadow: 0 6px 18px rgba(31,28,24,0.24);">+</button>

</div>
</x-dc>
<script data-dc-script data-props='{"moi":{"editor":"color","default":"#A94F2E","options":["#A94F2E","#8A5A2B","#9B4B62","#3F6B70"]},"elle":{"editor":"color","default":"#4F6549","options":["#4F6549","#3F6B70","#6B5A8A","#8A5A2B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var moi = this.props.moi || '#A94F2E';
    var elle = this.props.elle || '#4F6549';
    var H0 = 8, H1 = 22, PX = 37;

    function top(h) { return (h - H0) * PX; }
    function box(h, e) {
      return 'top:' + top(h).toFixed(1) + 'px;height:' + ((e - h) * PX).toFixed(1) + 'px;';
    }

    var hours = [];
    for (var h = H0; h <= H1; h += 2) {
      hours.push({
        text: h + ' h',
        label: 'position:absolute;right:0;top:' + (top(h) - 7).toFixed(1) + 'px;font-size:10.5px;color:#6B6358;font-weight:600;',
        line: 'position:absolute;left:0;right:0;top:' + top(h).toFixed(1) + 'px;height:1px;background:#EFE8D9;'
      });
    }

    function personal(c) {
      return function (b) {
        return {
          title: b[2],
          time: b[3],
          s: 'position:absolute;left:0;right:0;border-radius:9px;padding:7px 8px;box-sizing:border-box;overflow:hidden;color:#FFFDF8;background:' + c + ';' + box(b[0], b[1])
        };
      };
    }

    var mine = [[9, 13, 'Travail', '9 h – 13 h']].map(personal(moi));
    var hers = [
      [8.5, 12, 'Cours', '8 h 30 – 12 h'],
      [14, 18, 'Travail', '14 h – 18 h']
    ].map(personal(elle));

    var both = [[19.5, 22, 'Dîner dehors', '19 h 30 – 22 h']].map(function (b) {
      return {
        title: b[2],
        time: b[3],
        s: 'position:absolute;left:10px;right:10px;border-radius:11px;padding:9px 12px;box-sizing:border-box;overflow:hidden;color:#FFFDF8;background:#221F1A;' + box(b[0], b[1])
      };
    });

    var free = [
      [13, 14, '1 h'],
      [18, 19.5, '1 h 30']
    ].map(function (f) {
      return {
        tag: f[2] + ' libre',
        tagStyle: 'font-size:10.5px;font-weight:700;color:#6B5312;letter-spacing:0.4px;',
        s: 'position:absolute;left:0;right:0;background:#F6E2B2;display:flex;align-items:center;justify-content:center;' + box(f[0], f[1])
      };
    });

    return { hours: hours, mine: mine, hers: hers, both: both, free: free, moi: moi, elle: elle };
  }
}
</script>
</body>
</html>
