<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Karla:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Karla', 'Helvetica Neue', sans-serif; background: #F5F1E8; }
    a { color: #1F1C18; text-decoration: none; }
    a:hover { color: #A94F2E; }
    input { font-family: 'Karla', 'Helvetica Neue', sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1F1C18; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="padding: 24px 20px 0 20px; display: flex; align-items: center; justify-content: space-between;">
    <a href="Budget.dc.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1F1C18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <button type="button" aria-label="Exporter en CSV" style="height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid #E7E0D0; background: #FFFDF8; font-family: 'Karla', sans-serif; font-size: 12px; font-weight: 700; color: #1F1C18; cursor: pointer; display: flex; align-items: center; gap: 6px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1F1C18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M12 16l-5-5M12 16l5-5"></path><path d="M4 18v2h16v-2"></path></svg>
      CSV
    </button>
  </div>

  <div style="padding: 8px 20px 0 20px;">
    <div style="font-family: 'Fraunces', Georgia, serif; font-size: 27px; font-weight: 600; line-height: 1.15;">Toutes les dépenses</div>
  </div>

  <div style="padding: 14px 20px 0 20px;">
    <div style="height: 46px; border: 1px solid #E7E0D0; border-radius: 13px; background: #FFFDF8; display: flex; align-items: center; gap: 10px; padding: 0 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9183" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Rechercher une dépense</label>
      <input id="q" type="text" value="" placeholder="Rechercher…" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 14.5px; color: #1F1C18;">
    </div>
  </div>

  <div style="padding: 12px 20px 0 20px; display: flex; gap: 6px; overflow: hidden;">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button type="button" style="{{f.style}}">{{f.name}}</button>
    </sc-for>
  </div>

  <div style="margin: 14px 20px 0 20px; background: #FFFDF8; border: 1px solid #E7E0D0; border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; min-height: 0;">

    <div style="display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: #F0EADC; border-bottom: 1px solid #E7E0D0;">
      <div style="width: 38px; flex-shrink: 0; font-size: 9.5px; letter-spacing: 1px; font-weight: 700; color: #6B6358;">DATE</div>
      <div style="flex-grow: 1; font-size: 9.5px; letter-spacing: 1px; font-weight: 700; color: #6B6358;">INTITULÉ</div>
      <div style="flex-shrink: 0; font-size: 9.5px; letter-spacing: 1px; font-weight: 700; color: #6B6358;">MONTANT</div>
    </div>

    <div style="flex-grow: 1; overflow: hidden;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div>
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 7px 14px; background: #FAF6EC; border-bottom: 1px solid #EFE8D9;">
            <span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; color: #6B6358;">{{g.day}}</span>
            <span style="font-size: 11px; font-weight: 700; color: #6B6358;">{{g.sum}}</span>
          </div>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #F2ECDF;">
              <div style="width: 38px; flex-shrink: 0; font-size: 11.5px; font-weight: 600; color: #6B6358;">{{r.date}}</div>
              <div style="flex-grow: 1; min-width: 0;">
                <div style="font-size: 13.5px; font-weight: 700; line-height: 1.2;">{{r.label}}</div>
                <div style="display: flex; align-items: center; gap: 5px; margin-top: 2px;">
                  <span style="{{r.dot}}"></span>
                  <span style="font-size: 10.5px; color: #6B6358; font-weight: 600;">{{r.cat}}</span>
                </div>
              </div>
              <div style="font-family: 'Fraunces', Georgia, serif; font-size: 15.5px; font-weight: 600; flex-shrink: 0;">{{r.amount}}</div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="margin: 12px 20px 0 20px; background: #221F1A; color: #FFFDF8; border-radius: 14px; padding: 14px 17px; display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div style="font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; font-weight: 700; opacity: 0.6;">Total affiché</div>
      <div style="font-size: 11.5px; opacity: 0.7; margin-top: 2px;">23 dépenses en septembre</div>
    </div>
    <div style="font-family: 'Fraunces', Georgia, serif; font-size: 25px; font-weight: 600;">564,29 €</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="height: 74px; flex-shrink: 0; border-top: 1px solid #E7E0D0; display: flex; align-items: flex-start; padding: 11px 20px 0 20px; justify-content: space-between;">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1z"></path></svg>
      <span style="font-size: 10px; color: #6B6358; font-weight: 600;">Accueil</span>
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      <span style="font-size: 10px; color: #6B6358; font-weight: 600;">Agenda</span>
    </a>
    <a href="Budget.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1F1C18" stroke-width="1.8" stroke-linecap="round"><path d="M3 7h18v12H3z"></path><path d="M3 11h18M7 15h3"></path></svg>
      <span style="font-size: 10px; font-weight: 700;">Budget</span>
    </a>
    <a href="Espace.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"></circle><circle cx="16.5" cy="9.5" r="2.4"></circle><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"></path></svg>
      <span style="font-size: 10px; color: #6B6358; font-weight: 600;">Nous</span>
    </a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var color = {
      'Nourriture': '#A94F2E',
      'Loisirs': '#8A5A2B',
      'Transport': '#3F6B70',
      'Abonnements': '#6B5A8A',
      'Santé': '#9B4B62',
      'Autre': '#7A7263'
    };

    var filters = ['Tout', 'Nourriture', 'Loisirs', 'Transport'].map(function (n, i) {
      var s = 'height:34px;padding:0 14px;border-radius:17px;font-family:"Karla",sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;';
      s += i === 0
        ? 'background:#1F1C18;color:#FFFDF8;border:1px solid #1F1C18;'
        : 'background:#FFFDF8;color:#6B6358;border:1px solid #E7E0D0;';
      return { name: n, style: s };
    });

    var raw = [
      ['Aujourd\u2019hui', [
        ['17/09', 'Boulangerie', 'Nourriture', 4.20],
        ['17/09', 'Café', 'Nourriture', 2.80]
      ]],
      ['Hier', [
        ['16/09', 'Cinéma', 'Loisirs', 12.50],
        ['16/09', 'Supermarché', 'Nourriture', 43.85]
      ]],
      ['Lundi 15 septembre', [
        ['15/09', 'Essence', 'Transport', 45.00],
        ['15/09', 'Pharmacie', 'Santé', 11.30],
        ['15/09', 'Abonnement musique', 'Abonnements', 10.99]
      ]]
    ];

    function euro(v) { return v.toFixed(2).replace('.', ',') + ' €'; }

    var groups = raw.map(function (g) {
      var sum = g[1].reduce(function (s, r) { return s + r[3]; }, 0);
      return {
        day: g[0],
        sum: euro(sum),
        rows: g[1].map(function (r) {
          return {
            date: r[0],
            label: r[1],
            cat: r[2],
            amount: euro(r[3]),
            dot: 'width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;background:' + (color[r[2]] || '#7A7263') + ';'
          };
        })
      };
    });

    return { filters: filters, groups: groups };
  }
}
</script>
</body>
</html>
