<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Karla:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Karla', 'Helvetica Neue', sans-serif; background: #F5F1E8; }
    a { color: #1F1C18; text-decoration: none; }
    a:hover { color: #A94F2E; }
    input { font-family: 'Karla', 'Helvetica Neue', sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1F1C18; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 0 20px;">

  <div style="padding-top: 22px; display: flex; align-items: center; justify-content: space-between;">
    <a href="Budget.dc.html" aria-label="Annuler" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1F1C18" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="font-size: 13px; font-weight: 700;">Nouvelle dépense</div>
    <div style="width: 44px;"></div>
  </div>

  <div style="padding-top: 22px; text-align: center;">
    <div style="font-family: 'Fraunces', Georgia, serif; font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -1px;">12,50 <span style="color: #A9A192;">€</span></div>
    <button type="button" style="margin-top: 10px; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #E7E0D0; background: #FFFDF8; font-family: 'Karla', sans-serif; font-size: 12.5px; font-weight: 600; color: #6B6358; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      Aujourd'hui, 17 sept.
    </button>
  </div>

  <div style="padding-top: 20px;">
    <label for="libelle" style="font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; font-weight: 700; color: #6B6358; display: block; margin-bottom: 6px;">Intitulé</label>
    <input id="libelle" type="text" value="Cinéma" style="width: 100%; height: 50px; box-sizing: border-box; padding: 0 15px; border: 1px solid #E7E0D0; border-radius: 12px; background: #FFFDF8; font-size: 15px; font-weight: 600; color: #1F1C18;">
  </div>

  <div style="padding-top: 18px;">
    <div style="font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; font-weight: 700; color: #6B6358; margin-bottom: 9px;">Catégorie</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px;">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <button type="button" style="{{c.box}}">
          <span style="{{c.chip}}"></span>
          <span style="{{c.label}}">{{c.name}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-bottom: 12px;">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button type="button" style="{{k.style}}" aria-label="{{k.aria}}">{{k.face}}</button>
    </sc-for>
  </div>

  <div style="padding-bottom: 26px;">
    <a href="Budget.dc.html" style="height: 56px; border-radius: 28px; background: #1F1C18; color: #FFFDF8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; gap: 8px;">
      Enregistrer
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
    </a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [
      ['Courses', '#A94F2E'],
      ['Resto', '#C4703F'],
      ['Transport', '#3F6B70'],
      ['Loisirs', '#8A5A2B'],
      ['Logement', '#4F6549'],
      ['Santé', '#9B4B62'],
      ['Abos', '#6B5A8A'],
      ['Autre', '#7A7263']
    ];
    var picked = 'Loisirs';

    var cats = data.map(function (d) {
      var on = d[0] === picked;
      var box = 'box-sizing:border-box;height:62px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-family:inherit;padding:0 2px;';
      box += on
        ? 'background:#221F1A;border:1.5px solid #221F1A;'
        : 'background:#FFFDF8;border:1px solid #E7E0D0;';
      return {
        name: d[0],
        box: box,
        chip: 'width:14px;height:14px;border-radius:50%;display:inline-block;background:' + d[1] + ';',
        label: 'font-size:10.5px;font-weight:700;line-height:1.1;text-align:center;color:' + (on ? '#FFFDF8' : '#1F1C18') + ';'
      };
    });

    var faces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '←'];
    var keys = faces.map(function (f) {
      var s = 'height:50px;border-radius:13px;border:1px solid #E7E0D0;background:#FFFDF8;font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:600;color:#1F1C18;cursor:pointer;display:flex;align-items:center;justify-content:center;';
      if (f === '←') { s = s.replace('background:#FFFDF8;', 'background:#EDE6D7;'); }
      return { face: f, style: s, aria: f === '←' ? 'Effacer' : (f === ',' ? 'Virgule' : f) };
    });

    return { cats: cats, keys: keys };
  }
}
</script>
</body>
</html>
