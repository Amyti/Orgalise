<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Karla:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Karla', 'Helvetica Neue', sans-serif; background: #F5F1E8; }
    a { color: #1F1C18; text-decoration: none; }
    a:hover { color: #A94F2E; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1F1C18; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="padding: 26px 20px 0 20px; display: flex; align-items: flex-end; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #6B6358; font-weight: 600;">Mon budget</div>
      <div style="font-family: 'Fraunces', Georgia, serif; font-size: 29px; font-weight: 600; line-height: 1.12;">Septembre</div>
    </div>
    <div style="display: flex; gap: 6px;">
      <button type="button" aria-label="Mois précédent" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E7E0D0; background: #FFFDF8; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F1C18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <button type="button" aria-label="Mois suivant" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E7E0D0; background: #FFFDF8; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1F1C18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
  </div>

  <div style="margin: 18px 20px 0 20px; background: #221F1A; color: #FFFDF8; border-radius: 18px; padding: 19px 20px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div>
        <div style="font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; opacity: 0.6;">Dépensé</div>
        <div style="font-family: 'Fraunces', Georgia, serif; font-size: 40px; font-weight: 600; line-height: 1.05; margin-top: 3px;">564,29 €</div>
      </div>
      <div style="text-align: right; padding-bottom: 5px;">
        <div style="font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 600; color: #F6E2B2;">235,71 €</div>
        <div style="font-size: 10.5px; opacity: 0.65; font-weight: 600;">restants</div>
      </div>
    </div>
    <div style="height: 9px; border-radius: 5px; background: #3A352E; overflow: hidden; margin-top: 15px; display: flex;">
      <div style="width: 70.5%; background: #F6E2B2;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; opacity: 0.65;">
      <span>71 % du budget</span>
      <span>Plafond 800 €</span>
    </div>
  </div>

  <div style="margin: 20px 20px 0 20px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px;">
      <div style="font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; color: #6B6358;">Par catégorie</div>
      <div style="font-size: 11.5px; color: #6B6358;">6 postes</div>
    </div>

    <div style="height: 14px; border-radius: 7px; overflow: hidden; display: flex; gap: 2px;">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <div style="{{c.seg}}"></div>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 13px;">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <div style="background: #FFFDF8; border: 1px solid #E7E0D0; border-radius: 12px; padding: 10px 11px;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <span style="{{c.dot}}"></span>
            <span style="font-size: 12px; font-weight: 700;">{{c.name}}</span>
          </div>
          <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 5px;">
            <span style="font-family: 'Fraunces', Georgia, serif; font-size: 17px; font-weight: 600;">{{c.amount}}</span>
            <span style="font-size: 11px; color: #6B6358; font-weight: 600;">{{c.pct}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 18px 20px 0 20px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px;">
      <div style="font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; color: #6B6358;">Dernières dépenses</div>
      <a href="Tableau.dc.html" style="font-size: 12px; font-weight: 700; color: #A94F2E;">Tout voir</a>
    </div>
    <div style="background: #FFFDF8; border: 1px solid #E7E0D0; border-radius: 15px; overflow: hidden;">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
        <a href="Tableau.dc.html" style="{{r.row}}">
          <span style="{{r.dot}}"></span>
          <div style="flex-grow: 1; min-width: 0;">
            <div style="font-size: 13.5px; font-weight: 700;">{{r.label}}</div>
            <div style="font-size: 11px; color: #6B6358;">{{r.meta}}</div>
          </div>
          <div style="font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 600; flex-shrink: 0;">{{r.amount}}</div>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="height: 74px; flex-shrink: 0; border-top: 1px solid #E7E0D0; display: flex; align-items: flex-start; padding: 11px 20px 0 20px; justify-content: space-between;">
    <a href="Accueil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1z"></path></svg>
      <span style="font-size: 10px; color: #6B6358; font-weight: 600;">Accueil</span>
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      <span style="font-size: 10px; color: #6B6358; font-weight: 600;">Agenda</span>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1F1C18" stroke-width="1.8" stroke-linecap="round"><path d="M3 7h18v12H3z"></path><path d="M3 11h18M7 15h3"></path></svg>
      <span style="font-size: 10px; font-weight: 700;">Budget</span>
    </div>
    <a href="Espace.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6358" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"></circle><circle cx="16.5" cy="9.5" r="2.4"></circle><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"></path></svg>
      <span style="font-size: 10px; color: #6B6358; font-weight: 600;">Nous</span>
    </a>
  </div>

  <a href="Ajout.dc.html" aria-label="Ajouter une dépense" style="position: absolute; right: 20px; bottom: 88px; width: 56px; height: 56px; border-radius: 50%; background: #1F1C18; color: #FFFDF8; font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(31,28,24,0.24);">+</a>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [
      ['Nourriture', 238.40, '#A94F2E'],
      ['Loisirs', 124.00, '#8A5A2B'],
      ['Transport', 96.30, '#3F6B70'],
      ['Autre', 42.10, '#7A7263'],
      ['Abonnements', 34.99, '#6B5A8A'],
      ['Santé', 28.50, '#9B4B62']
    ];
    var total = data.reduce(function (s, d) { return s + d[1]; }, 0);

    function euro(v) {
      return v.toFixed(2).replace('.', ',') + ' €';
    }

    var cats = data.map(function (d) {
      var share = d[1] / total * 100;
      return {
        name: d[0],
        amount: euro(d[1]),
        pct: Math.round(share) + ' %',
        seg: 'flex-grow:' + share.toFixed(2) + ';background:' + d[2] + ';',
        dot: 'width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;background:' + d[2] + ';'
      };
    });

    var rows = [
      ['Boulangerie', "Aujourd'hui · Nourriture", '4,20 €', '#A94F2E'],
      ['Cinéma', 'Hier · Loisirs', '12,50 €', '#8A5A2B'],
      ['Supermarché', '16 sept. · Nourriture', '43,85 €', '#A94F2E']
    ];

    var recent = rows.map(function (r, i) {
      return {
        label: r[0],
        meta: r[1],
        amount: r[2],
        row: 'display:flex;align-items:center;gap:11px;padding:12px 14px;color:#1F1C18;' + (i < rows.length - 1 ? 'border-bottom:1px solid #EFE8D9;' : ''),
        dot: 'width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;background:' + r[3] + ';'
      };
    });

    return { cats: cats, recent: recent };
  }
}
</script>
</body>
</html>
